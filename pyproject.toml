[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-log"
version = "2.4.0"
description = "SentinelLog — Advanced Security Log Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Thenuda Sahas", email = "thenudasahas2008@users.noreply.github.com" }
]
classifiers = [
  "Topic :: Security",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Logging",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "email-validator>=2.1.0",
  "argon2-cffi>=23.1.0",
  "pyjwt>=2.8.0",
  "python-multipart>=0.0.9",
  "python-dateutil>=2.9.0",
  "reportlab>=4.2.0",
  "websockets>=12.0",
  "alembic>=1.13.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
